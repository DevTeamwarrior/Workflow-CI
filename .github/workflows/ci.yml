name: Machine Learning Workflow CI

on:
  push:
    branches:
      - main

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest

    steps:
    # 1. Mengambil kode dari repositori GitHub
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2. Menyiapkan runtime Python di GitHub Virtual Machine
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    # 3. Memasang pustaka MLflow yang dibutuhkan untuk kompilasi Docker
    - name: Install MLflow Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow==2.19.0

    # 4. Melakukan autentikasi masuk ke Docker Hub menggunakan GitHub Secrets
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 5. Membangun Docker Image dan mempublikasikannya secara otomatis ke Docker Hub
    - name: Build and Push Docker Image using MLflow
      run: |
        # Mengubah direktori kerja ke dalam folder MLProject
        cd MLProject
        
        # Sintaks mlflow build-docker untuk membungkus environment proyek menjadi Image mandiri
        mlflow models build-docker -m . -n ${{ secrets.DOCKERHUB_USERNAME }}/mlflow-flower-model:latest
        
        # Mengunggah Image hasil build ke cloud Docker Hub
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/mlflow-flower-model:latest